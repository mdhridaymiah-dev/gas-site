<script>
// অভিযোগ থেকে রঙিন ফেসবুক-পোস্ট কার্ড (ছবি) ও ক্যাপশন বানায়। ব্রাউজারেই আঁকে, তাই বাংলা যুক্তাক্ষর ঠিক থাকে।
(function () {
  const OUT = { resolved: ["সমাধান হয়েছে", "#10b981"], unresolved: ["সমাধান হয়নি", "#ef4444"], pending: ["অপেক্ষমাণ", "#f59e0b"] };
  const bn = (n) => String(n).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
  const money = (n) => "৳" + bn(Number(n).toLocaleString("en-US"));
  const F = '"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif';

  function wrap(ctx, text, max, maxLines) {
    const words = String(text || "").replace(/\s+/g, " ").trim().split(" "), lines = [];
    let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) {
      lines.length = maxLines;
      let l = lines[maxLines - 1];
      while (l.length && ctx.measureText(l + "…").width > max) l = l.slice(0, -1);
      lines[maxLines - 1] = l + "…";
    }
    return lines;
  }
  function rr(x, px, py, w, h, r, fill) { x.fillStyle = fill; x.beginPath(); x.roundRect(px, py, w, h, r); x.fill(); }
  function pill(x, px, py, text, bg, fg) {
    x.font = "700 34px " + F;
    const w = x.measureText(text).width + 52;
    rr(x, px, py, w, 62, 31, bg);
    x.fillStyle = fg; x.fillText(text, px + 26, py + 43);
    return w;
  }

  async function makeCard(r) {
    try { await document.fonts.load('700 40px "Hind Siliguri"'); await document.fonts.load('400 40px "Hind Siliguri"'); } catch {}
    const W = 1080, H = 1350, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d");
    // রঙিন ব্যাকগ্রাউন্ড
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#2563eb"); g.addColorStop(0.55, "#7c3aed"); g.addColorStop(1, "#ec4899");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const o1 = x.createRadialGradient(W - 40, 60, 10, W - 40, 60, 460);
    o1.addColorStop(0, "rgba(249,115,22,.85)"); o1.addColorStop(1, "rgba(249,115,22,0)");

const same=(a,b)=>{a=gkey(a);b=gkey(b);return !!a&&!!b&&(a===b||(a.length>4&&b.length>4&&(a.includes(b)||b.includes(a))))};
const gname=x=>L==="bn"?(x.bn_name||x.name):(x.name||x.bn_name),gval=x=>x.bn_name||x.name;
function gOpts(sel,arr,first){const v=sel.value;sel.textContent="";const o0=el("option","",first);o0.value="";sel.append(o0);
  arr.forEach(x=>{const o=el("option","",gname(x));o.value=gval(x);o.dataset.id=x.id;sel.append(o)});
  if([...sel.options].some(o=>o.value===v))sel.value=v}
const selId=s=>s.selectedOptions[0]&&s.selectedOptions[0].dataset.id;
function geoDiv(){const v=$("#dv").value;if(!v)return null;const en=(DIV.find(d=>d[0]===v)||[])[1];const k=x=>gkey(x);return GEO.div.find(e=>k(e.bn_name)===k(v)||k(e.name)===k(en))||null}
function fillDist(){const d=geoDiv();gOpts($("#gd"),d?GEO.dis.filter(x=>String(x.division_id)===String(d.id)):[],t("pickDist"));fillUpz()}
function fillUpz(){const id=selId($("#gd"));gOpts($("#gu"),id?GEO.upz.filter(x=>String(x.district_id)===String(id)):[],t("pickUpz"));fillUni();fillPO()}
function fillUni(){const id=selId($("#gu"));gOpts($("#gn"),id?GEO.uni.filter(x=>String(x.upazilla_id??x.upazila_id)===String(id)):[],t("pickUni"))}
function fillPO(){
  const sel=$("#gp"),v=sel.value;sel.textContent="";const o0=el("option","",t("pickPO"));o0.value="";sel.append(o0);
  const dn=$("#gd").selectedOptions[0],un=$("#gu").selectedOptions[0];
  if(GEO.po&&GEO.pdis&&dn&&dn.value){
    const dist=GEO.dis.find(x=>String(x.id)===dn.dataset.id)||{};
    const pd=GEO.pdis.find(p=>same(p.name,dist.name)||same(p.bn_name,dist.bn_name));
    let rows=pd?GEO.po.filter(r=>String(r.district_id)===String(pd.id)):[];
    if(un&&un.value){const u=GEO.upz.find(x=>String(x.id)===un.dataset.id)||{};const nar=rows.filter(r=>same(r.upazila,u.name)||same(r.upazila,u.bn_name));if(nar.length)rows=nar}
    const seen=new Set();rows=rows.filter(r=>{const k=r.postOffice+"|"+r.postCode;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>String(a.postOffice).localeCompare(String(b.postOffice)));
    rows.forEach(r=>{const o=el("option","",r.postOffice+(r.postCode?" ("+r.postCode+")":""));o.value=r.postOffice;o.dataset.code=r.postCode||"";sel.append(o)});
  }
  const ot=el("option","",t("otherPO"));ot.value="__other";sel.append(ot);
  if([...sel.options].some(o=>o.value===v))sel.value=v;
  poChange();
}
function poChange(){const sel=$("#gp"),o=sel.selectedOptions[0],other=sel.value==="__other";$("#gc").value=(o&&o.dataset.code)||"";const tx=$("#gpT");tx.hidden=!other;tx.disabled=!other;sel.name=other?"":"postOffice"}
function geoRefresh(){
  if(GEO.ok){fillDist();return}
  [["gd","pickDist"],["gu","pickUpz"],["gn","pickUni"],["gp","pickPO"]].forEach(([i,k])=>{const s=$("#"+i);if(!s.hidden){s.textContent="";const o=el("option","",t(k));o.value="";s.append(o)}});
}
const GEO_SRC=[
  // উৎস ০: নিজের সাইটের geo.json (scripts/build-geo.mjs দিয়ে বানানো, থাকলে সবচেয়ে নির্ভরযোগ্য)
  async()=>{const r=await fetch("/geo.json");if(!r.ok)throw 0;const j=await r.json();return{div:j.div||[],dis:j.dis||[],upz:j.upz||[],uni:j.uni||[]}},
  // উৎস ১: npm bd-geojs
  async()=>{const m=await import("https://cdn.jsdelivr.net/npm/bd-geojs@1.0.1/+esm"),d=m.default||{};
    const g=(...k)=>{for(const n of k){const v=m[n]||d[n];if(Array.isArray(v)&&v.length)return v}return[]};
    return{div:g("divisions"),dis:g("districts"),upz:g("upazillas","upazilas"),uni:g("unions")}},
  // উৎস ২: nuhil/bangladesh-geocode (GitHub, jsDelivr/Statically)
  async()=>{
    const rows=j=>{const t=Array.isArray(j)?j.find(x=>x&&x.type==="table"):null;return t?t.data:(Array.isArray(j)?j:[])};
    for(const b of ["https://cdn.jsdelivr.net/gh/nuhil/bangladesh-geocode@master/","https://cdn.statically.io/gh/nuhil/bangladesh-geocode/master/"]){
      try{const f=n=>fetch(b+n+"/"+n+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(rows);
        const [div,dis,upz,uni]=await Promise.all([f("divisions"),f("districts"),f("upazilas"),f("unions")]);
        if(dis.length&&upz.length)return{div,dis,upz,uni}}catch{}
    }return{div:[],dis:[],upz:[],uni:[]}}
];
async function loadGeo(){
  let ok=false;
  for(const src of GEO_SRC){
    try{const r=await src();if(r.dis.length&&r.upz.length&&r.uni.length){GEO.div=r.div;GEO.dis=r.dis;GEO.upz=r.upz;GEO.uni=r.uni;ok=true;break}}catch{}
  }
  if(!ok)throw new Error("geo");
  const arr=x=>Array.isArray(x)?x:(Object.values(x||{}).find(Array.isArray)||[]);
  for(const b of ["https://cdn.jsdelivr.net/npm/bangladesh-geojson/src/data/","https://cdn.jsdelivr.net/gh/ifahimreza/bangladesh-geojson@master/src/data/"]){
    try{const [p,q]=await Promise.all([fetch(b+"bd-postcodes.json").then(r=>r.json()),fetch(b+"bd-districts.json").then(r=>r.json())]);GEO.po=arr(p);GEO.pdis=arr(q);if(GEO.po.length&&GEO.pdis.length)break}catch{}
  }
}
function failGeo(){[["gd","gdT"],["gu","guT"],["gn","gnT"],["gp","gpT"]].forEach(([a,b])=>{const s=$("#"+a),x=$("#"+b);s.hidden=true;s.disabled=true;x.hidden=false;x.disabled=false});$("#gc").value=""}
function startGeo(){if(GEO.p)return;$("#geoSt").textContent=t("geoLoading");
  GEO.p=(async()=>{try{await loadGeo()}catch{await new Promise(r=>setTimeout(r,1500));await loadGeo()}})().then(()=>{GEO.ok=true;$("#geoSt").textContent="";geoRefresh()}).catch(()=>{failGeo();$("#geoSt").textContent=t("geoFail")})}
const addr=r=>[r.district,r.upazila,r.union,r.area].filter(Boolean).join(", ");
const locL=r=>[[t("division"),trD(r.division,DIV)],[t("district"),r.district],[t("upazila"),r.upazila],[t("union"),r.union]].filter(x=>x[1]).map(x=>x[0]+": "+x[1]).join(" · ");
async function load(){
  try{const a=await (await fetch("/api/reports")).json();all=a.map(r=>({office:"অন্যান্য",amount:0,outcome:"pending",conf:0,type:"অন্যান্য",district:"",upazila:"",union:"",postOffice:"",postCode:"",...r}));render()}
  catch{$("#cards").textContent=t("fail")}
}
$("#lang").onclick=()=>{L=L==="bn"?"en":"bn";try{localStorage.setItem("lang",L)}catch{}lang()};
$("#theme").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
["fo","fd","fz","fu","so"].forEach(i=>$("#"+i).onchange=render);$("#q").oninput=render;
$("#vc").onclick=()=>{view="c";render()};$("#vt").onclick=()=>{view="t";render()};
$("#dv").onchange=()=>{if(GEO.ok)fillDist()};
$("#gd").onchange=()=>{if(GEO.ok&&!$("#dv").value){const dis=GEO.dis.find(x=>String(x.id)===selId($("#gd")));const e=dis&&GEO.div.find(v=>String(v.id)===String(dis.division_id));const o=e&&DIV.find(d=>same(d[0],e.bn_name)||same(d[1],e.name));if(o)$("#dv").value=o[0]}fillUpz()};
$("#gu").onchange=()=>{fillUni();fillPO()};$("#gp").onchange=poChange;
startGeo();
$("#anon").onchange=e=>{$("#nm").hidden=e.target.checked};
$("#f").onsubmit=async e=>{
  e.preventDefault();const b=$("#go"),o=Object.fromEntries(new FormData(e.target));
  o.anonymous=$("#anon").checked;b.disabled=true;$("#msg").textContent="";
  try{
    const r=await fetch("/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});
    const j=await r.json();
    if(!r.ok)throw new Error((j.error||"Error").split(" / ")[L==="bn"?0:1]||j.error);
    e.target.reset();geoRefresh();$("#anon").checked=true;$("#nm").hidden=true;
    $("#msg").textContent=j.pending?t("done"):t("doneLive");load();
  }catch(err){$("#msg").textContent=err.message}
  b.disabled=false;
};
lang();load();
try{if(!sessionStorage.getItem("v")){sessionStorage.setItem("v","1");fetch("/api/track",{method:"POST"})}}catch{}
</script>
